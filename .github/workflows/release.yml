# Builds the RepoSentry desktop app for Windows from the private source repo,
# signs it with Azure Artifact Signing, and publishes the installers as a Release.
# (macOS is paused until the Apple Developer account is ready.)
#
# Setup (done once), this repo → Settings → Secrets and variables → Actions:
#   Secret   SOURCE_DEPLOY_KEY  private half of a READ-ONLY deploy key on AHAdd40451/Reposentry
#   Variable API_URL            live API, e.g. https://api.reposentry.coderivals.ltd
#   Variable DASHBOARD_URL      live dashboard (sign in with browser, billing)
#
# Azure Artifact Signing (so Windows shows "Verified publisher"):
#   Variable AZURE_SIGNING_ENDPOINT  e.g. https://eus.codesigning.azure.net
#   Variable AZURE_SIGNING_ACCOUNT   Artifact Signing account name
#   Variable AZURE_CERT_PROFILE      certificate profile name
#   Secret   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET  (app registration
#            with the "Artifact Signing Certificate Profile Signer" role on the account)
#
# Release: Actions → "Release desktop app" → Run workflow → version 1.0.0
#   or: gh workflow run release.yml -f version=1.0.0
name: Release desktop app

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.0.1'
        required: true
      source_ref:
        description: 'Branch or tag of the source repo to build'
        default: main
      allow_unsigned:
        description: 'Allow an unsigned build (testing only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/desktop
    env:
      VERSION: ${{ github.event.inputs.version }}
      API_URL: ${{ vars.API_URL }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://admin.reposentry.coderivals.ltd' }}
      SIGN_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      SIGN_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      SIGN_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
      ALLOW_UNSIGNED: ${{ github.event.inputs.allow_unsigned }}
    steps:
      - name: Check out private source (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: AHAdd40451/Reposentry
          ref: ${{ github.event.inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: src
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/desktop/src-tauri -> target

      - name: Check settings
        shell: bash
        run: |
          if [ -z "$API_URL" ]; then echo "::error::Set the API_URL repository variable first"; exit 1; fi

      - name: Set version and live API URL
        shell: bash
        run: |
          V="${VERSION#v}"
          printf 'VITE_API_URL=%s\nVITE_DASHBOARD_URL=%s\n' "$API_URL" "$DASHBOARD_URL" > .env
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.argv[1];
            const api = process.argv[2].replace(/\/$/, "");
            c.app.security.csp = c.app.security.csp
              .replace(/ http:\/\/localhost:\d+/g, "")
              .replace("connect-src ", `connect-src ${api} `);
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log("version", c.version, "| csp", c.app.security.csp);
          ' "$V" "$API_URL"
          echo "TAG=v$V" >> "$GITHUB_ENV"

      - name: Set up Azure signing
        shell: bash
        run: |
          if [ -z "$SIGN_ENDPOINT" ] || [ -z "$SIGN_ACCOUNT" ] || [ -z "$SIGN_PROFILE" ]; then
            if [ "$ALLOW_UNSIGNED" = "true" ]; then echo "::warning::Azure signing not set up: this build is UNSIGNED"; exit 0; fi
            echo "::error::Azure signing is not set up (AZURE_SIGNING_* variables). Set it up, or run with allow_unsigned for a test build."; exit 1
          fi
          cargo install artifact-signing-cli --locked
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            const [e, a, prof] = process.argv.slice(1);
            c.bundle.windows = { ...c.bundle.windows, signCommand: `artifact-signing-cli -e ${e} -a ${a} -c ${prof} -d RepoSentry %1` };
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log("signing with", a, "/", prof);
          ' "$SIGN_ENDPOINT" "$SIGN_ACCOUNT" "$SIGN_PROFILE"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: src/desktop
          tagName: ${{ env.TAG }}
          releaseName: RepoSentry ${{ env.TAG }}
          releaseBody: |
            Download the Windows installer below: `-setup.exe` (or `.msi` for IT deployment).
            The macOS version is coming soon.

            Sign in with the account details from your purchase email.
          releaseDraft: false
          prerelease: false
