# Builds the RepoSentry desktop app for Windows from the private source repo,
# signs it with SSL.com eSigner (publisher "Code Rivals Ltd"), and publishes the installers as a Release.
# (macOS is paused until the Apple Developer account is ready.)
#
# Setup (done once), this repo → Settings → Secrets and variables → Actions:
#   Secret   SOURCE_DEPLOY_KEY  private half of a READ-ONLY deploy key on AHAdd40451/Reposentry
#   Variable API_URL            live API, e.g. https://api.reposentry.coderivals.ltd
#   Variable DASHBOARD_URL      live dashboard (sign in with browser, billing)
#
# SSL.com eSigner code signing (so Windows shows "Code Rivals Ltd" as the publisher):
#   Secret   ES_USERNAME, ES_PASSWORD, CREDENTIAL_ID, ES_TOTP_SECRET
#   Tauri runs the sign script on the app .exe before it is packed into the installers,
#   then on the setup .exe, its uninstaller and the .msi, before the update files are made.
#   Each file uses one eSigner signing from the plan's monthly allowance.
#
# Auto-update: installed apps read latest.json from the newest release.
#   Secret   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (updater key; the
#            public half is in desktop/src-tauri/tauri.conf.json → plugins.updater.pubkey)
#
# Release: Actions → "Release desktop app" → Run workflow → version 1.0.0
#   or: gh workflow run release.yml -f version=1.0.0
name: Release desktop app

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.0.1'
        required: true
      source_ref:
        description: 'Branch or tag of the source repo to build'
        default: main
      allow_unsigned:
        description: 'Allow an unsigned build (testing only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/desktop
    env:
      VERSION: ${{ github.event.inputs.version }}
      API_URL: ${{ vars.API_URL }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://admin.reposentry.coderivals.ltd' }}
      HAS_SIGNER: ${{ secrets.ES_USERNAME != '' && secrets.ES_PASSWORD != '' && secrets.CREDENTIAL_ID != '' && secrets.ES_TOTP_SECRET != '' }}
      ALLOW_UNSIGNED: ${{ github.event.inputs.allow_unsigned }}
    steps:
      - name: Check out private source (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: AHAdd40451/Reposentry
          ref: ${{ github.event.inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: src
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/desktop/src-tauri -> target

      - name: Check settings
        shell: bash
        run: |
          if [ -z "$API_URL" ]; then echo "::error::Set the API_URL repository variable first"; exit 1; fi

      - name: Set version and live API URL
        shell: bash
        run: |
          V="${VERSION#v}"
          printf 'VITE_API_URL=%s\nVITE_DASHBOARD_URL=%s\n' "$API_URL" "$DASHBOARD_URL" > .env
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.argv[1];
            const api = process.argv[2].replace(/\/$/, "");
            c.app.security.csp = c.app.security.csp
              .replace(/ http:\/\/localhost:\d+/g, "")
              .replace("connect-src ", `connect-src ${api} `);
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log("version", c.version, "| csp", c.app.security.csp);
          ' "$V" "$API_URL"
          echo "TAG=v$V" >> "$GITHUB_ENV"

      - name: Set up eSigner code signing
        shell: pwsh
        run: |
          if ($env:HAS_SIGNER -ne 'true') {
            if ($env:ALLOW_UNSIGNED -eq 'true') { Write-Output "::warning::eSigner secrets are missing: this build is UNSIGNED"; exit 0 }
            Write-Output "::error::eSigner secrets are missing (ES_USERNAME, ES_PASSWORD, CREDENTIAL_ID, ES_TOTP_SECRET). Add them, or run with allow_unsigned for a test build."; exit 1
          }
          # SSL.com CodeSignTool (the same tool sslcom/esigner-codesign runs), production environment
          $v = 'v1.3.2'
          $tool = Join-Path $env:RUNNER_TEMP 'CodeSignTool'
          $zip = Join-Path $env:RUNNER_TEMP 'CodeSignTool.zip'
          Invoke-WebRequest "https://github.com/SSLcom/CodeSignTool/releases/download/$v/CodeSignTool-$v-windows.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $tool -Force
          Set-Content (Join-Path $tool 'conf\code_sign_tool.properties') -Encoding ascii -Value @(
            'CLIENT_ID=kaXTRACNijSWsFdRKg_KAfD3fqrBlzMbWs6TwWHwAn8',
            'OAUTH2_ENDPOINT=https://login.ssl.com/oauth2/token',
            'CSC_API_ENDPOINT=https://cs.ssl.com',
            'TSA_URL=http://ts.ssl.com',
            'TSA_LEGACY_URL=http://ts.ssl.com/legacy')

          # Tauri calls this for every Windows file it signs. Secrets come from the environment,
          # never from the command line Tauri prints. Java is called directly so cmd.exe can't
          # mangle special characters in the password.
          $script = Join-Path $env:RUNNER_TEMP 'esign.ps1'
          @'
          param([Parameter(Mandatory)][string]$File)
          $ErrorActionPreference = 'Stop'
          $tool = Join-Path $env:RUNNER_TEMP 'CodeSignTool'
          $java = Join-Path $tool 'jdk-11.0.2\bin\java.exe'
          $jar = Get-ChildItem (Join-Path $tool 'jar') -Filter 'code_sign_tool-*.jar' | Select-Object -First 1
          $env:CODE_SIGN_TOOL_PATH = $tool
          Write-Host "Signing $(Split-Path $File -Leaf)"
          for ($try = 1; $try -le 3; $try++) {
            Push-Location $tool
            try {
              $out = & $java -Xmx1024M -jar $jar.FullName sign "-username=$env:ES_USERNAME" "-password=$env:ES_PASSWORD" "-credential_id=$env:CREDENTIAL_ID" "-totp_secret=$env:ES_TOTP_SECRET" "-input_file_path=$File" '-override=true' 2>&1 | Out-String
            } finally { Pop-Location }
            # CodeSignTool can exit 0 on failure, so trust only the file's signature.
            $sig = Get-AuthenticodeSignature -FilePath $File
            if ($sig.Status -eq 'Valid') { Write-Host "Signed by $($sig.SignerCertificate.Subject)"; exit 0 }
            Write-Host "Try $try failed ($($sig.Status)): $($out.Trim())"
            Start-Sleep -Seconds (10 * $try)
          }
          Write-Error "Could not sign $File"
          exit 1
          '@ | Set-Content $script -Encoding utf8

          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.bundle.windows = { ...c.bundle.windows, signCommand: { cmd: "pwsh", args: ["-NoProfile", "-NonInteractive", "-File", process.argv[1], "%1"] } };
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log("signing with SSL.com eSigner");
          ' "$script"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          # Signs the update files so installed apps only accept updates built here
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src/desktop
          tagName: ${{ env.TAG }}
          releaseName: RepoSentry ${{ env.TAG }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseBody: |
            Download the Windows installer below: `-setup.exe` (or `.msi` for IT deployment).
            The macOS version is coming soon.

            Sign in with the account details from your purchase email.
          # Stays a draft (invisible to installed apps) until the signature check below passes.
          releaseDraft: true
          prerelease: false

      - name: Check the Windows signatures
        if: env.HAS_SIGNER == 'true'
        shell: pwsh
        run: |
          # Check the installers and the app .exe packed inside each of them
          # (the copy left in target/release is not the one that ships).
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe -File | Select-Object -First 1
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi -File | Select-Object -First 1
          if (-not $setup -or -not $msi) { Write-Output "::error::The setup .exe or .msi is missing"; exit 1 }
          $out = Join-Path $env:RUNNER_TEMP 'unpacked'
          7z x $setup.FullName "-o$out\nsis" -y | Out-Null
          Start-Process msiexec.exe -Wait -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$out\msi`"")
          $inner = @(Get-ChildItem $out -Recurse -File -Filter reposentry.exe)
          if ($inner.Count -lt 2) { Write-Output "::error::Could not find the app .exe inside both installers (found $($inner.Count))"; exit 1 }
          $files = @($setup, $msi) + $inner
          $bad = 0
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature -FilePath $f.FullName
            $who = $s.SignerCertificate.Subject
            $label = if ($f.FullName.StartsWith($out)) { "inside " + $f.FullName.Substring($out.Length + 1).Split([char]92)[0] + ": " + $f.Name } else { $f.Name }
            Write-Output ("{0,-45} {1,-8} {2}" -f $label, $s.Status, $who)
            if ($s.Status -ne 'Valid' -or $who -notmatch 'Code Rivals') { $bad++ }
            if (-not $s.TimeStamperCertificate) { Write-Output "::error::$($f.Name) has no timestamp"; $bad++ }
          }
          if ($bad) { Write-Output "::error::$bad file(s) are not signed by Code Rivals Ltd. The release stays a draft."; exit 1 }
          $sig = Get-AuthenticodeSignature -FilePath (Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1).FullName
          "### Windows publisher`n``$($sig.SignerCertificate.GetNameInfo('SimpleName', $false))``" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$HAS_SIGNER" != "true" ] && [ "$ALLOW_UNSIGNED" != "true" ]; then exit 1; fi
          gh release edit "$TAG" -R "${{ github.repository }}" --draft=false --latest
